      text: "there's something visible when I look at the frequencies"
    - speaker: Vance
      text: "she learned this from someone who used shortwave. a different era."
    - speaker: Kay
      text: "who taught her"
    - speaker: Vance
      text: "the same person who taught me. and who eventually sold us both out."
  question: "What phrase appears when the audio is visualized?"

