      text: "extract them. read left to right, top to bottom. eight bits per character."
    - speaker: Kay
      text: "she took this photo, didn't she. the predecessor."
    - speaker: Vance
      text: "she left it where i'd find it. i'm passing it on."
  question: "What message is hidden in the image's least significant bits?"

