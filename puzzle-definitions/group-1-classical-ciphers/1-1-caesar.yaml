schema_version: "1.0"
id: "1-1"
group_id: 1
type: conversation
title: "Caesar Cipher"
flavor: "A burner phone left face-up on a park bench. A handler called VANCE is passing something to a new recruit — but one message isn't coming through."

# RNG call order is fixed — never reorder after first publish.
params:
  shift:     !rng rand_int(1, 13)
  names:
    - "SARAH"
    - "JAMES"
    - "EMILY"
    - "OLIVER"
    - "SOPHIE"
    - "MARCUS"
    - "DIANA"
    - "JORDAN"
    - "CLAIRE"
    - "RYAN"
  questions:
    - "what's the name?"
    - "who do i need to reach?"
    - "and the name?"
    - "who am i looking for?"
    - "the contact's name?"
    - "who exactly?"
    - "give me a name"
    - "who is it?"
  name:      !rng rand_choice(names)
  question:  !rng rand_choice(questions)

content:
  exchanges:
    - speaker: Vance
      text: "first contact established. burn this number after."
    - speaker: Kay
      text: "who is this"
    - speaker: Vance
      text: "someone who knew your predecessor. there's a name you need to reach."
    - speaker: Kay
      text: !gen identity(question)
    - speaker: Vance
      text: !gen caesar_encode(name, shift)
    - speaker: Kay
      text: "my screen's glitching. this looks wrong."
    - speaker: Vance
      text: !gen key_reminder(shift)
    - speaker: Kay
      text: "nobody briefed me on anything"
  question: "Who should Kay reach out to?"

answer: !gen identity(name)

hints: []
